<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Full-screen landscape video template: the generated video fills the whole 1920x1080 frame.
         1024x576 (16:9) is generated, then scaled up to fill the frame. -->
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="576">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'PingFang TC', 'PingFang SC', 'Noto Sans CJK TC', 'Noto Sans CJK SC',
                         'Source Han Sans', 'Microsoft JhengHei', 'Microsoft YaHei', sans-serif;
        }

        .frame {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        .scrim-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 230px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .scrim-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 360px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.45) 50%, rgba(0, 0, 0, 0) 100%);
        }

        .title-wrapper {
            position: absolute;
            top: 56px;
            left: 80px;
            width: 1760px;
        }

        .title {
            display: inline-block;
            font-size: {{title_size:number=52}}px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 3px;
            white-space: nowrap;
            border-left: 8px solid {{accent_color:color=#FFD166}};
            padding-left: 24px;
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55), 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .subtitle-wrapper {
            position: absolute;
            left: 160px;
            bottom: 70px;
            width: 1600px;
            text-align: center;
        }

        .subtitle {
            font-size: {{subtitle_size:number=48}}px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.5;
            letter-spacing: 2px;
            word-break: break-word;
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.95),
                0 0 12px rgba(0, 0, 0, 0.75),
                0 0 24px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="scrim-top"></div>
        <div class="scrim-bottom"></div>

        <div class="title-wrapper">
            <div class="title">{{title}}</div>
        </div>

        <div class="subtitle-wrapper">
            <div class="subtitle">{{text}}</div>
        </div>
    </div>

    <script>
        (function fitTitle() {
            try {
                var el = document.querySelector('.title');
                if (!el || !el.textContent.trim()) return;
                var size = parseFloat(window.getComputedStyle(el).fontSize);
                while (el.scrollWidth > 1760 && size > 28) {
                    size -= 2;
                    el.style.fontSize = size + 'px';
                }
            } catch (e) {
                console.error('fitTitle failed', e);
            }
        })();
    </script>
</body>
</html>
